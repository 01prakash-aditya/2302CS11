[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashlab"
version = "0.1.0"
description = "Diagnostic CLI tool for bytes, cryptographic hashing, avalanche analysis, and canonical JSON"
authors = [
    { name = "Student", email = "student@example.edu" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
hashlab = "hashlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
